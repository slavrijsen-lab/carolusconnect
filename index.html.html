<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carolus Connect – Projectdashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
body{font-family:"Segoe UI",system-ui,Arial,sans-serif}
.lc{position:sticky;left:0;z-index:2;width:250px;flex:0 0 250px}
.hd{position:sticky;top:0;z-index:3}
.bar{position:absolute;top:8px;height:20px;border-radius:5px;overflow:hidden;cursor:pointer}
.bar.est{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 4px,transparent 4px 8px)}
.bar .pg{height:100%;background:rgba(255,255,255,.38)}
.bar.red{outline:2px solid #ef4444;outline-offset:1px}
.ms{position:absolute;top:9px;width:18px;height:18px;transform:rotate(45deg);background:#eab308;border:2px solid #a855f7;cursor:pointer}
.ms.red{border-color:#ef4444}
.ms.evt{width:22px;height:22px;top:7px;background:#facc15;border:3px solid #dc2626;box-shadow:0 0 0 4px rgba(250,204,21,.3)}
.ln{position:absolute;top:0;bottom:0;width:2px;pointer-events:none;z-index:1}
.ln.evt2{width:3px;box-shadow:0 0 6px 1px rgba(250,204,21,.6)}
.qb.on{background:#0891b2;color:#fff;border-color:#0891b2}
[data-row]{cursor:pointer}
[data-row]:hover .lc{background:#1e293b!important}
[data-bucket].drop-hi{outline:2px dashed #22d3ee;outline-offset:-2px}
[data-evtcard]{cursor:pointer}
[data-evtcard]:hover{filter:brightness(1.12)}
dialog{border:1px solid #334155;border-radius:12px;background:#0f172a;color:#e2e8f0;width:min(600px,94vw);padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
@media print{
 body{background:#fff!important;color:#000!important}
 header,#drop,section.flex.flex-wrap.items-center,#kpi,.grid.lg\:grid-cols-3,#tip{display:none!important}
 #ganttSection{border:none!important}
 #leg{color:#000!important}
 #leg i{border:1px solid #000}
 #gantt{max-height:none!important;overflow:visible!important;border:none!important}
 .lc{position:static!important;background:#fff!important;color:#000!important;border-right:1px solid #ccc}
 .hd{position:static!important;background:#fff!important}
 .hd .lc,.hd div{color:#000!important}
 [class*="bg-slate"]{background:#fff!important}
 [class*="text-slate"]{color:#000!important}
 [class*="border-slate"]{border-color:#ccc!important}
 .bar,.ms{filter:saturate(1.3)}
 .ln{opacity:.7}
}
</style></head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
<div class="max-w-[1500px] mx-auto p-4 space-y-4">

<header class="flex flex-wrap items-end justify-between gap-2">
 <div><h1 class="text-2xl font-bold text-white">Carolus Connect</h1>
 <p class="text-sm text-slate-400">Projectplan dashboard · Carolus Borromeus College</p></div>
 <div class="flex gap-2">
  <button id="bNew" class="bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-medium rounded-lg px-3 py-2">+ Nieuwe taak</button>
  <button id="bEd" class="bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium rounded-lg px-3 py-2">+ Nieuwe editie</button>
 </div>
</header>

<label id="drop" class="block cursor-pointer border-2 border-dashed border-slate-600 hover:border-cyan-500 rounded-xl px-4 py-5 text-center bg-slate-900/60 transition">
 <input type="file" id="file" accept=".xlsx,.xls" class="hidden">
 <div class="font-medium text-slate-100">Sleep hier een Planner-/Project-Excelexport naartoe, of klik om te bladeren (.xlsx / .xls)</div>
 <div id="msg" class="text-xs text-slate-400 mt-1"></div>
</label>

<section class="flex flex-wrap items-center gap-2">
 <button class="qb border border-slate-700 rounded-lg px-3 py-1.5 text-sm" data-q="all">Alle taken</button>
 <button class="qb border border-slate-700 rounded-lg px-3 py-1.5 text-sm" data-q="6m" title="Okt 2026 – Mrt 2027">Komende 6 maanden</button>
 <select id="fe" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm"></select>
 <select id="fb" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm"></select>
 <select id="fw" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm"></select>
 <input id="fs" placeholder="Zoek taken…" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm flex-1 min-w-[180px]">
</section>

<section class="grid grid-cols-2 lg:grid-cols-4 gap-3" id="kpi"></section>

<section id="ganttSection" class="bg-slate-900 border border-slate-800 rounded-xl">
 <div class="flex items-center justify-between px-4 pt-3">
  <div class="flex flex-wrap gap-4 text-xs text-slate-400" id="leg"></div>
  <button id="bPrint" class="shrink-0 border border-slate-700 hover:border-cyan-500 rounded-lg px-3 py-1.5 text-sm">🖨️ Print / PDF</button>
 </div>
 <div id="gantt" class="overflow-auto max-h-[62vh] m-3 mt-2 rounded-lg border border-slate-800 relative"></div>
</section>

<section class="grid lg:grid-cols-3 gap-4">
 <div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><h2 class="font-semibold mb-2">Werklast per bucket</h2><div class="h-64"><canvas id="c1"></canvas></div></div>
 <div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><h2 class="font-semibold mb-2">Verdeling per teamlid</h2><div class="h-64"><canvas id="c2"></canvas></div></div>
 <div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><h2 class="font-semibold mb-2">Voltooide taken</h2><div class="h-64"><canvas id="c3"></canvas></div></div>
</section>
</div>
<div id="tip" class="fixed z-50 hidden pointer-events-none max-w-xs bg-slate-800 border border-slate-600 rounded-lg p-3 text-xs shadow-xl"></div>

<dialog id="dlg">
 <form id="fm" class="p-5 space-y-3" method="dialog">
  <h3 id="dTitle" class="text-lg font-semibold text-white">Taak bewerken</h3>
  <div class="grid grid-cols-2 gap-3">
   <label class="col-span-2 flex flex-col text-xs text-slate-400 gap-1">Taak
    <input id="m_taak" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100"></label>
   <label class="flex flex-col text-xs text-slate-400 gap-1">Editie
    <input id="m_editie" list="edl" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100">
    <datalist id="edl"></datalist></label>
   <label class="flex flex-col text-xs text-slate-400 gap-1">Bucket
    <input id="m_bucket" list="bkl" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100">
    <datalist id="bkl"></datalist></label>
   <label class="flex flex-col text-xs text-slate-400 gap-1">Toegewezen aan (met ; scheiden)
    <input id="m_who" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100"></label>
   <label class="flex flex-col text-xs text-slate-400 gap-1">Status
    <select id="m_status" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100">
     <option>Niet gestart</option><option>In uitvoering</option><option>Voltooid</option></select></label>
   <label class="flex flex-col text-xs text-slate-400 gap-1">Startdatum
    <input type="date" id="m_start" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100"></label>
   <label class="flex flex-col text-xs text-slate-400 gap-1">Einddatum
    <input type="date" id="m_due" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100"></label>
   <label class="flex flex-col text-xs text-slate-400 gap-1">Prioriteit
    <select id="m_prio" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100">
     <option>Normaal</option><option>Urgent</option></select></label>
   <label class="flex flex-col text-xs text-slate-400 gap-1">Mijlpaal
    <select id="m_ms" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100">
     <option value="0">Nee</option><option value="1">Ja</option></select></label>
   <label class="col-span-2 flex items-center gap-2 text-xs text-slate-300 bg-slate-800/60 border border-yellow-600/40 rounded-lg px-3 py-2">
    <input type="checkbox" id="m_evt" class="accent-yellow-500">
    Dit is de evenementdag van deze editie — het evenement werkt naar deze datum toe</label>
   <label class="flex flex-col text-xs text-slate-400 gap-1">Subtaken voltooid
    <input type="number" min="0" id="m_cd" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100"></label>
   <label class="flex flex-col text-xs text-slate-400 gap-1">Subtaken totaal
    <input type="number" min="0" id="m_ct" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100"></label>
   <label class="col-span-2 flex flex-col text-xs text-slate-400 gap-1">Voortgang: <span id="m_pctv" class="text-slate-200 font-medium">0%</span>
    <input type="range" id="m_pct" min="0" max="100" step="5" class="accent-cyan-500"></label>
  </div>
  <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
   <button type="button" id="m_del" class="text-red-400 hover:text-red-300 text-sm mr-auto">Verwijderen</button>
   <button type="button" id="m_cancel" class="border border-slate-600 rounded-lg px-3 py-1.5 text-sm">Annuleren</button>
   <button type="button" id="m_save" class="bg-cyan-600 hover:bg-cyan-500 rounded-lg px-3 py-1.5 text-sm font-medium">Opslaan</button>
  </div>
 </form>
</dialog>

<script>
const $=s=>document.querySelector(s), DAY=864e5;
const ymd=(y,m,d)=>Date.UTC(y,m-1,d)/DAY;
const now=new Date(), TODAY=ymd(now.getFullYear(),now.getMonth()+1,now.getDate());
const EVENT=ymd(2027,1,13);
let EVENTS={};
const eventFor=ed=>(ed in EVENTS)?EVENTS[ed]:EVENT;
function featuredEvent(){
 const eds=[...new Set(T.map(t=>t.editie))];
 if(F.editie)return{ed:F.editie,day:eventFor(F.editie)};
 if(!eds.length)return{ed:DEF_ED,day:EVENT};
 let up=null,past=null;
 eds.forEach(ed=>{const d=eventFor(ed);
  if(d>=TODAY&&(!up||d<up.day))up={ed,day:d};
  if(d<TODAY&&(!past||d>past.day))past={ed,day:d};
 });
 return up||past;
}
const fmt=n=>{const d=new Date(n*DAY);return String(d.getUTCDate()).padStart(2,"0")+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+d.getUTCFullYear()};
const toISO=n=>new Date(n*DAY).toISOString().slice(0,10);
const fromISO=s=>{const [y,m,d]=s.split("-").map(Number);return ymd(y,m,d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WIN={all:null,"6m":[ymd(2026,10,1),ymd(2027,3,31)]};
const PAL=["#38bdf8","#4ade80","#fbbf24","#c084fc","#fb7185","#2dd4bf","#f97316","#a3e635"];
const DEF_ED="Editie 1 2026-2027";
let idc=1,uid=()=>"t"+(idc++);

/* ---------- parsing helpers ---------- */
function pd(v){
 if(v==null||v==="")return null;
 if(v instanceof Date&&!isNaN(v))return ymd(v.getFullYear(),v.getMonth()+1,v.getDate());
 if(typeof v==="number"&&v>20000&&v<80000)return Math.floor(v)-25569;
 const s=String(v).trim();let m;
 if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return ymd(+m[1],+m[2],+m[3]);
 if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;return ymd(y,+m[2],+m[1])}
 if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})$/))return ymd(+m[2]<7?2027:2026,+m[2],+m[1]);
 return null;
}
const SYN={task:["taaknaam","taak","title","titel","taskname","task","naam"],
 bucket:["bucketnaam","bucketname","bucket","categorie","category","kolom","column"],
 who:["toegewezenaan","assignedto","eigenaar","owner","assignees","toegewezen"],
 due:["vervaldatum","einddatum","duedate","deadline","enddate","einde"],
 start:["begindatum","startdatum","startdate","start","begin"],
 status:["voortgang","status","progress"],prio:["prioriteit","priority"],
 editie:["editie","edition","projecteditie"],
 cdone:["voltooidechecklistitems","completedchecklistitems","checklistcompleted","checklistdone"],
 ctot:["checklistitems","subtaken","subtasks","checklist","checklisttotal"]};
const nk=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
function mapCols(hdrs){
 const H=hdrs.map(h=>[h,nk(h)]),M={},used=new Set();
 for(const k in SYN){
  let f=null;
  for(const s of SYN[k]){f=H.find(([h,n])=>n===s&&!used.has(h));if(f)break}
  if(!f&&k!=="ctot")for(const s of SYN[k]){f=H.find(([h,n])=>n.includes(s)&&!used.has(h));if(f)break}
  if(f){M[k]=f[0];used.add(f[0])}
 }
 return M;
}
function build(rows,M){
 return rows.map(r=>{
  const g=k=>M[k]?r[M[k]]:"",name=String(g("task")).trim();
  if(!name)return null;
  let cd=0,ct=0;const a=String(g("ctot")),mm=a.match(/(\d+)\s*\/\s*(\d+)/);
  if(mm){cd=+mm[1];ct=+mm[2]}else{ct=parseInt(a)||0;cd=parseInt(g("cdone"))||0}
  const st=String(g("status")).toLowerCase(),pr=String(g("prio")).toLowerCase();
  return{id:uid(),name,bucket:String(g("bucket")).trim()||"Geen bucket",
   editie:String(g("editie")).trim(),
   who:String(g("who")).split(/[;,\/]+/).map(x=>x.trim()).filter(Boolean),
   start:pd(g("start")),due:pd(g("due")),cd,ct,
   done:/complet|voltooid|afgerond|klaar|done|^100/.test(st),
   prog:/progress|bezig|uitvoering|actief|active/.test(st),
   urgent:/urgent|dringend|spoed|!/.test(pr+st),high:/important|belangrijk|hoog|high/.test(pr),est:false};
 }).filter(Boolean);
}
function estimate(T){
 T.forEach(t=>{if(!t.editie)t.editie=DEF_ED});
 const by={};T.forEach(t=>(by[t.bucket+"\u0001"+t.editie]=by[t.bucket+"\u0001"+t.editie]||[]).push(t));
 for(const k in by){
  const L=by[k],EV=eventFor(L[0].editie),dated=L.filter(t=>t.due!=null||t.start!=null);
  const lo=Math.min(TODAY,...dated.map(t=>t.start??t.due));
  const und=L.filter(t=>t.due==null&&t.start==null);
  const step=Math.max(14,EV-30-lo)/Math.max(1,und.length);
  und.forEach((t,i)=>{
   const n=t.name.toLowerCase();let s,e;
   if(/evaluatie|opvolg|follow/.test(n)){s=EV+1;e=EV+8}
   else if(/evenementendag|event day/.test(n)){s=e=EV}
   else if(/laatste|controle|ontvangst|opstelling|final/.test(n)){s=EV-7;e=EV-1}
   else if(/sprint/.test(n)){s=EV-28;e=EV-1}
   else if(/kick-?off/.test(n)){s=lo;e=lo+7}
   else{s=lo+Math.round(i*step);e=s+Math.round(step*1.5)}
   t.start=s;t.due=e;t.est=true;
  });
  let prev=null;
  L.filter(t=>t.due!=null&&t.start==null).sort((x,y)=>x.due-y.due).forEach(t=>{
   let s=t.due-7;if(prev!=null&&prev+1>s&&prev+1<=t.due)s=prev+1;
   t.start=s;t.est=true;prev=t.due;
  });
  L.filter(t=>t.due==null&&t.start!=null).forEach(t=>{t.due=t.start+7;t.est=true});
 }
 T.forEach(t=>refresh(t));
 return T;
}
function refresh(t){
 if(t.due<t.start)[t.start,t.due]=[t.due,t.start];
 t.ms=t.start===t.due||/evenementendag|evaluatie na|kick-?off/i.test(t.name);
 if(t.done)t.pct=100;
 else if(!t.manualPct)t.pct=t.ct?Math.round(100*t.cd/t.ct):(t.prog?50:0);
 if(!t.editie)t.editie=DEF_ED;
}

/* ---------- sample data (same pipeline as an uploaded file) ---------- */
function sample(){
 const PM="Projectmanagement & Logistiek",LC="Leerlingencampagne",OP="Ouder- & Professionals-campagne",UE="Uitvoering Evenement - John Haanen";
 const R=[
 ["Evaluatie na het Evenement",PM,"","","21-01-2027","Not started","",0,0],
 ["Ontvangst sprekers",PM,"","","","Not started","",1,0],
 ["Aanmeldingen & Registratiebeheer",PM,"","","30-09-2026","Not started","",1,0],
 ["AV & Technische Opstelling",PM,"","","","In progress","",2,0],
 ["Ambassadeursprogramma Leerlingen",LC,"Sam;TE;SL","","18-09-2026","Not started","Urgent",0,0],
 ["Aankondigingen",LC,"","","","Not started","",0,0],
 ["Schoolposters & Digitale Schermen",LC,"","","","Not started","",0,0],
 ["Concept Leerlingencampagne Ontwikkelen",LC,"Sam","","","In progress","",0,0],
 ["Media- & Communitybenadering",OP,"","","","Not started","",0,0],
 ["Werving Zorg- & Gezondheidsnetwerk",OP,"","","","Not started","",0,0],
 ["LinkedIn Promotie",OP,"","","","Not started","",0,0],
 ["Nieuwsbriefartikel School",OP,"","","","Not started","",0,0],
 ["Communicatieplan Ouders",OP,"","","","Not started","",0,0],
 ["Social Media Content Maken",OP,"","","","Not started","",0,0],
 ["Opvolgingscommunicatie",UE,"","","","Not started","",0,0],
 ["Uitvoering Evenementendag",UE,"","","13-01-2027","Not started","",0,0],
 ["Laatste Operationele Controle",UE,"","","","Not started","",0,0],
 ["Promotie-Eindsprint Ouders & Zorg",UE,"","","","Not started","",0,0],
 ["Promotie-Eindsprint Leerlingen",UE,"","","","Not started","",0,0],
 ["Coördinatie Inhoud & Sprekers",UE,"","","","Not started","",0,0],
 ["Kick-off Bijeenkomst Evenement",UE,"","","","Not started","",0,0]];
 return R.map(r=>({"Task Name":r[0],"Bucket Name":r[1],"Editie":DEF_ED,"Assigned To":r[2],"Start Date":r[3],"Due Date":r[4],"Progress":r[5],"Priority":r[6],"Checklist Items":r[7],"Completed Checklist Items":r[8]}));
}

/* ---------- state & load ---------- */
let T=[],BK=[],F={q:"6m",editie:"",bucket:"",who:"",text:""},ch1=null,ch2=null;
function refreshDropdowns(keepEditie){
 const eds=[...new Set(T.map(t=>t.editie))];
 BK=[...new Set(T.map(t=>t.bucket))];
 const who=[...new Set(T.flatMap(t=>t.who))];
 $("#fe").innerHTML='<option value="">Alle edities</option>'+eds.map(e=>`<option>${esc(e)}</option>`).join("");
 $("#fe").value=keepEditie&&eds.includes(F.editie)?F.editie:(eds[0]||"");
 F.editie=$("#fe").value;
 $("#fb").innerHTML='<option value="">Alle buckets</option>'+BK.map(b=>`<option>${esc(b)}</option>`).join("");
 $("#fw").innerHTML='<option value="">Alle toegewezenen</option>'+who.map(w=>`<option>${esc(w)}</option>`).join("")+'<option value="__none">Niet toegewezen</option>';
 $("#edl").innerHTML=eds.map(e=>`<option value="${esc(e)}">`).join("");
 $("#bkl").innerHTML=BK.map(b=>`<option value="${esc(b)}">`).join("");
}
function load(rows,label){
 const M=mapCols(Object.keys(rows[0]||{}));
 if(!M.task){$("#msg").innerHTML='<span class="text-red-400">Geen taakkolom gevonden. Gevonden kolommen: '+esc(Object.keys(rows[0]||{}).join(", "))+"</span>";return}
 T=estimate(build(rows,M));
 F.bucket=F.who="";
 refreshDropdowns(false);
 const map=Object.entries(M).map(([k,v])=>`${k} ← ${esc(v)}`).join(" · "),est=T.filter(t=>t.est).length;
 $("#msg").innerHTML=`${esc(label)}: ${T.length} taken. Gekoppeld: ${map}.`+(est?` <span class="text-amber-400">${est} taken hebben geschatte datums (gestreepte balken).</span>`:"");
 render();
}
function readFile(f){
 if(typeof XLSX==="undefined")return $("#msg").innerHTML='<span class="text-red-400">SheetJS kon niet worden geladen (CDN geblokkeerd?).</span>';
 const r=new FileReader();
 r.onload=e=>{
  try{
   const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});let best=null;
   wb.SheetNames.forEach(n=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:"",raw:true});
    if(rows.length&&mapCols(Object.keys(rows[0])).task&&(!best||rows.length>best.length))best=rows;
   });
   if(!best)throw new Error("Geen tabblad met een taak-/titelkolom gevonden");
   load(best,f.name);
  }catch(err){$("#msg").innerHTML='<span class="text-red-400">Bestand kon niet worden gelezen: '+esc(err.message)+"</span>"}
 };
 r.readAsArrayBuffer(f);
}
$("#file").onchange=e=>e.target.files[0]&&readFile(e.target.files[0]);
const dz=$("#drop");
["dragenter","dragover"].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add("border-cyan-500")}));
["dragleave","drop"].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove("border-cyan-500")}));
dz.addEventListener("drop",e=>e.dataTransfer.files[0]&&readFile(e.dataTransfer.files[0]));
document.querySelectorAll(".qb").forEach(b=>b.onclick=()=>{F.q=b.dataset.q;render()});
$("#fe").onchange=e=>{F.editie=e.target.value;render()};
$("#fb").onchange=e=>{F.bucket=e.target.value;render()};
$("#fw").onchange=e=>{F.who=e.target.value;render()};
$("#fs").oninput=e=>{F.text=e.target.value.trim().toLowerCase();render()};
$("#kpi").addEventListener("click",e=>{
 const c=e.target.closest("[data-evtcard]");if(!c)return;
 const ed=c.dataset.ed,cur=toISO(eventFor(ed));
 const v=prompt("Evenementdag voor '"+ed+"' (jjjj-mm-dd):",cur);
 if(!v)return;const d=fromISO(v);if(isNaN(d))return alert("Ongeldige datum.");
 EVENTS[ed]=d;render();
});

/* ---------- add / edit / delete modal ---------- */
let editId=null;
function openModal(id){
 editId=id;
 const t=id?T.find(x=>x.id===id):null;
 $("#dTitle").textContent=t?"Taak bewerken":"Nieuwe taak";
 $("#m_del").style.display=t?"":"none";
 $("#m_taak").value=t?t.name:"";
 $("#m_editie").value=t?t.editie:(F.editie||DEF_ED);
 $("#m_bucket").value=t?t.bucket:(F.bucket||BK[0]||"");
 $("#m_who").value=t?t.who.join("; "):"";
 $("#m_status").value=t?(t.done?"Voltooid":t.prog?"In uitvoering":"Niet gestart"):"Niet gestart";
 $("#m_start").value=t?toISO(t.start):toISO(TODAY);
 $("#m_due").value=t?toISO(t.due):toISO(TODAY+7);
 $("#m_prio").value=t&&t.urgent?"Urgent":"Normaal";
 $("#m_ms").value=t&&t.ms?"1":"0";
 $("#m_evt").checked=!!(t&&t.isEventDay);
 $("#m_cd").value=t?t.cd:0;
 $("#m_ct").value=t?t.ct:0;
 $("#m_pct").value=t?t.pct:0;
 $("#m_pctv").textContent=(t?t.pct:0)+"%";
 $("#dlg").showModal();
 $("#m_taak").focus();
}
$("#bNew").onclick=()=>openModal(null);
$("#m_pct").oninput=e=>$("#m_pctv").textContent=e.target.value+"%";
$("#m_evt").onchange=e=>{if(e.target.checked){$("#m_ms").value="1";$("#m_due").value=$("#m_start").value}};
$("#m_cancel").onclick=()=>$("#dlg").close();
$("#m_save").onclick=()=>{
 const name=$("#m_taak").value.trim(),editie=$("#m_editie").value.trim()||DEF_ED,bucket=$("#m_bucket").value.trim()||"Geen bucket";
 const isEvt=$("#m_evt").checked;
 const s=fromISO($("#m_start").value);let d=isEvt?s:fromISO($("#m_due").value);
 if(!name)return alert("Vul een taaknaam in.");
 if(d<s)return alert("De einddatum ligt voor de startdatum.");
 const status=$("#m_status").value,who=$("#m_who").value.split(/[;,\/]+/).map(x=>x.trim()).filter(Boolean);
 const cd=Math.max(0,parseInt($("#m_cd").value)||0),ct=Math.max(0,parseInt($("#m_ct").value)||0);
 const t=editId?T.find(x=>x.id===editId):{id:uid()};
 Object.assign(t,{name,editie,bucket,who,start:s,due:d,
  done:status==="Voltooid",prog:status==="In uitvoering",
  urgent:$("#m_prio").value==="Urgent",high:false,cd,ct,isEventDay:isEvt,
  ms:isEvt?true:$("#m_ms").value==="1",est:false,
  manualPct:true,pct:Math.max(0,Math.min(100,parseInt($("#m_pct").value)||0))});
 if(isEvt){
  EVENTS[editie]=d;
  T.forEach(x=>{if(x.id!==t.id&&x.editie===editie&&x.isEventDay)x.isEventDay=false});
 }
 refresh(t);
 if(!editId)T.push(t);
 refreshDropdowns(true);
 $("#dlg").close();render();
};
$("#m_del").onclick=()=>{
 if(editId&&confirm("Deze taak verwijderen?")){T=T.filter(x=>x.id!==editId);refreshDropdowns(true);$("#dlg").close();render()}
};

/* ---------- new edition ---------- */
$("#bPrint").onclick=()=>window.print();
$("#bEd").onclick=()=>{
 const eds=[...new Set(T.map(t=>t.editie))];
 const srcEd=F.editie||eds[0]||DEF_ED;
 const src=T.filter(t=>t.editie===srcEd);
 if(!src.length)return alert("Er zijn geen taken om als sjabloon te gebruiken. Voeg eerst een taak toe.");
 const nr=eds.length+1;
 const name=prompt("Naam van de nieuwe editie:","Editie "+nr+" 2026-2027");
 if(!name)return;
 if(eds.includes(name))return alert("Deze editienaam bestaat al. Kies een andere naam.");
 const startStr=prompt("Startdatum van de nieuwe editie (jjjj-mm-dd). Alle datums schuiven mee.",toISO(TODAY));
 if(!startStr)return;
 const ns=fromISO(startStr);if(isNaN(ns))return alert("Ongeldige datum.");
 const lo=Math.min(...src.map(t=>t.start)),shift=ns-lo;
 const defEvent=toISO(eventFor(srcEd)+shift);
 const evStr=prompt("Evenementdag van de nieuwe editie (jjjj-mm-dd):",defEvent);
 const ev=evStr?fromISO(evStr):NaN;
 EVENTS[name]=isNaN(ev)?eventFor(srcEd)+shift:ev;
 src.forEach(t=>{
  const c={...t,id:uid(),editie:name,start:t.start+shift,due:t.due+shift,
   done:false,prog:false,cd:0,est:false,manualPct:false,pct:0,isEventDay:false};
  if(t.isEventDay){c.isEventDay=true;c.start=c.due=EVENTS[name];c.ms=true}
  refresh(c);T.push(c);
 });
 F.editie=name;refreshDropdowns(true);render();
};

/* ---------- filtering & rendering ---------- */
const overdue=t=>t.due<TODAY&&!t.done;
function visible(){
 const w=WIN[F.q];
 return T.filter(t=>{
  if(F.editie&&t.editie!==F.editie)return false;
  if(F.bucket&&t.bucket!==F.bucket)return false;
  if(F.who==="__none"?t.who.length:(F.who&&!t.who.includes(F.who)))return false;
  if(F.text&&!(t.name+" "+t.bucket+" "+t.who.join(" ")).toLowerCase().includes(F.text))return false;
  if(w&&!overdue(t)&&(t.due<w[0]||t.start>w[1]))return false;
  return true;
 });
}
const color=t=>t.done?"#22c55e":t.prog?"#3b82f6":"#64748b";
function render(){
 document.querySelectorAll(".qb").forEach(b=>b.classList.toggle("on",b.dataset.q===F.q));
 const V=visible();
 kpis(V);gantt(V);charts(V);
}
function kpis(V){
 const urg=V.filter(t=>(t.urgent||t.high)&&!t.done).length,
  n30=V.filter(t=>!t.done&&t.due>=TODAY&&t.due<=TODAY+30).length,
  late=V.filter(overdue).length,fe=featuredEvent(),left=fe.day-TODAY;
 const card=(l,v,s,c)=>`<div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><div class="text-xs text-slate-400">${l}</div><div class="text-3xl font-bold ${c||"text-white"}">${v}</div><div class="text-xs text-slate-500">${s}</div></div>`;
 $("#kpi").innerHTML=card("Totaal aantal taken",V.length,"van "+T.length+" in het plan")+
  card("Urgent / hoge prioriteit",urg,late+" te laat",urg||late?"text-red-400":"")+
  card("Verval binnen 30 dagen",n30,"nog niet voltooid","text-cyan-300")+
  `<div data-evtcard data-ed="${esc(fe.ed)}" class="rounded-xl p-4 border border-purple-500/50 bg-gradient-to-br from-purple-900/40 to-yellow-900/20"><div class="text-xs text-yellow-300">Evenementdag · ${fmt(fe.day)}</div><div class="text-3xl font-bold text-white">${left>=0?left+" dagen":Math.abs(left)+" dagen geleden"}</div><div class="text-xs text-slate-400">${esc(fe.ed)} · ${left>=0?"≈ "+Math.floor(left/7)+" weken "+left%7+" dagen te gaan":"was op "+fmt(fe.day)}</div><div class="text-[10px] text-slate-500 mt-0.5">Klik om te wijzigen</div></div>`;
}
function gantt(V){
 const el=$("#gantt");
 $("#leg").innerHTML=`<span><i class="inline-block w-3 h-3 rounded-sm bg-blue-500 mr-1"></i>In uitvoering</span><span><i class="inline-block w-3 h-3 rounded-sm bg-green-500 mr-1"></i>Voltooid</span><span><i class="inline-block w-3 h-3 rounded-sm bg-slate-500 mr-1"></i>Niet gestart</span><span class="text-red-400">▭ Rode rand = te laat / urgent</span><span class="text-yellow-300">◆ Mijlpaal</span><span class="text-yellow-300">★ Evenementdag</span><span class="text-cyan-300">| Vandaag</span><span class="text-yellow-300">| Evenementdag</span><span class="text-slate-500">Klik = bewerken · slepen = verplaatsen naar bucket · Ctrl+slepen = kopiëren</span>`;
 if(!V.length){el.innerHTML='<div class="p-10 text-center text-slate-500">Geen taken komen overeen met de huidige filters.</div>';return}
 const w=WIN[F.q],fe=featuredEvent();
 let mn=Math.min(...V.map(t=>t.start),w?w[0]:1e9,TODAY-3),mx=Math.max(...V.map(t=>t.due),w?w[1]:0,fe.day+10);
 if(!w)mn=Math.min(...V.map(t=>t.start),TODAY-3);
 mn-=(new Date(mn*DAY).getUTCDay()+6)%7;
 const days=mx-mn+1,dw=Math.max(4,Math.min(14,(el.clientWidth-270)/days)),W=Math.round(days*dw);
 const gs=`background-image:linear-gradient(to right,#1e293b 1px,transparent 1px);background-size:${7*dw}px 100%`;
 const MN=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
 let mo="",wk="";
 for(let d=mn;d<=mx;d++){const dt=new Date(d*DAY);
  if(dt.getUTCDate()===1||d===mn)mo+=`<span class="absolute top-1 text-[11px] text-slate-300 whitespace-nowrap" style="left:${(d-mn)*dw}px">${MN[dt.getUTCMonth()]} ${dt.getUTCFullYear()}</span>`;
  if(dt.getUTCDay()===1)wk+=`<span class="absolute top-1 text-[10px] text-slate-500" style="left:${(d-mn)*dw+2}px">${dt.getUTCDate()}</span>`}
 const X=n=>(n-mn)*dw;
 let h=`<div class="hd bg-slate-900"><div class="flex h-6 border-b border-slate-800"><div class="lc bg-slate-900 px-3 text-xs text-slate-400 leading-6">Taak</div><div class="relative" style="width:${W}px">${mo}</div></div><div class="flex h-6 border-b border-slate-800"><div class="lc bg-slate-900"></div><div class="relative" style="width:${W}px;${gs}">${wk}</div></div></div>`;
 BK.forEach((b,bi)=>{
  const L=V.filter(t=>t.bucket===b).sort((a,c)=>a.start-c.start);if(!L.length)return;
  const c=PAL[bi%PAL.length];
  h+=`<div class="flex h-8 bg-slate-800/60 border-b border-slate-800" data-bucket="${esc(b)}"><div class="lc bg-slate-800 px-3 leading-8 font-semibold truncate" title="${esc(b)}"><span style="color:${c}">●</span> ${esc(b)} <span class="text-slate-500 font-normal">${L.length}</span></div><div style="width:${W}px"></div></div>`;
  L.forEach(t=>{
   const red=overdue(t)||(t.urgent&&!t.done),x=X(t.start),bw=Math.max(dw,(t.due-t.start+1)*dw);
   const shape=t.ms?`<div class="ms ${red?"red":""} ${t.isEventDay?"evt":""}" data-i="${t.id}" style="left:${X(t.due)+dw/2-9}px"></div>`
    :`<div class="bar ${t.est?"est":""} ${red?"red":""}" data-i="${t.id}" style="left:${x}px;width:${bw}px;background:${color(t)}"><div class="pg" style="width:${t.pct}%"></div>${t.urgent&&bw>24?'<b class="absolute inset-y-0 left-1 text-white text-xs leading-5">!</b>':""}</div>`;
   h+=`<div class="flex h-9 border-b border-slate-800/70" data-row="${t.id}" data-bucket="${esc(b)}" draggable="true"><div class="lc bg-slate-900 px-3 flex flex-col justify-center overflow-hidden"><span class="truncate text-[13px]">${t.isEventDay?'<span class="text-yellow-400">★ </span>':""}${t.urgent&&!t.done?'<b class="text-red-400">! </b>':""}${esc(t.name)}</span><span class="text-[11px] text-slate-500 truncate">${esc(t.who.join(", ")||"Niet toegewezen")} · ${fmt(t.due)}</span></div><div class="relative" style="width:${W}px;${gs}">${shape}</div></div>`;
  });
 });
 const line=(n,c,cls)=>n>=mn&&n<=mx?`<div class="ln ${cls||""}" style="left:${250+X(n)}px;background:${c}"></div>`:"";
 el.innerHTML=`<div style="width:${250+W}px;position:relative">${h}${line(TODAY,"#22d3ee")}${line(fe.day,"#eab308","evt2")}</div>`;
 if(!el.dataset.sc){el.dataset.sc=1;if(TODAY>=mn)el.scrollLeft=Math.max(0,X(TODAY)-100)}
}
document.addEventListener("mouseover",e=>{
 const b=e.target.closest("[data-i]"),tip=$("#tip");
 if(!b){tip.classList.add("hidden");return}
 const t=T.find(x=>x.id===b.dataset.i);if(!t)return;
 const st=t.done?"Voltooid":t.prog?"In uitvoering":"Niet gestart";
 tip.innerHTML=`<div class="font-semibold text-sm text-white mb-1">${esc(t.name)}</div><div><span class="text-slate-400">Editie:</span> ${esc(t.editie)}</div><div><span class="text-slate-400">Bucket:</span> ${esc(t.bucket)}</div><div><span class="text-slate-400">Toegewezen:</span> ${esc(t.who.join(", ")||"Niet toegewezen")}</div><div><span class="text-slate-400">Periode:</span> ${fmt(t.start)} – ${fmt(t.due)}${t.est?' <i class="text-amber-400">(geschat)</i>':""}</div><div><span class="text-slate-400">Subtaken:</span> ${t.ct?t.cd+"/"+t.ct:"geen"} · ${t.pct}%</div><div><span class="text-slate-400">Status:</span> ${st}${t.urgent?' · <b class="text-red-400">Urgent</b>':""}${overdue(t)?' · <b class="text-red-400">Te laat</b>':""}</div>`;
 tip.classList.remove("hidden");
});
document.addEventListener("mousemove",e=>{
 const tip=$("#tip");if(tip.classList.contains("hidden"))return;
 tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+"px";
 tip.style.top=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8)+"px";
});
$("#gantt").addEventListener("click",e=>{
 const row=e.target.closest("[data-row]");
 if(row)openModal(row.dataset.row);
});
$("#gantt").addEventListener("dragstart",e=>{
 const row=e.target.closest("[data-row]");
 if(!row){e.preventDefault();return}
 e.dataTransfer.setData("text/plain",row.dataset.row);
 e.dataTransfer.effectAllowed="copyMove";
});
$("#gantt").addEventListener("dragover",e=>{
 const tgt=e.target.closest("[data-bucket]");
 if(!tgt)return;
 e.preventDefault();
 e.dataTransfer.dropEffect=(e.ctrlKey||e.metaKey)?"copy":"move";
 tgt.classList.add("drop-hi");
});
$("#gantt").addEventListener("dragleave",e=>{
 const tgt=e.target.closest("[data-bucket]");
 if(tgt)tgt.classList.remove("drop-hi");
});
$("#gantt").addEventListener("drop",e=>{
 const tgt=e.target.closest("[data-bucket]");
 if(!tgt)return;
 e.preventDefault();tgt.classList.remove("drop-hi");
 const id=e.dataTransfer.getData("text/plain"),src=T.find(x=>x.id===id);
 if(!src)return;
 const bucket=tgt.dataset.bucket;
 if(e.ctrlKey||e.metaKey){
  const c={...src,id:uid(),bucket,isEventDay:false};T.push(c);
 }else{
  if(src.bucket===bucket)return;
  src.bucket=bucket;
 }
 refreshDropdowns(true);render();
});
let ch3=null;
function charts(V){
 Chart.defaults.color="#94a3b8";Chart.defaults.borderColor="#1e293b";
 const bc=BK.map(b=>V.filter(t=>t.bucket===b).length),wc={};
 V.forEach(t=>(t.who.length?t.who:["Niet toegewezen"]).forEach(w=>wc[w]=(wc[w]||0)+1));
 const wl=Object.keys(wc);
 const done=V.filter(t=>t.done).length,prog=V.filter(t=>!t.done&&t.prog).length,todo=V.length-done-prog;
 if(!ch1){
  ch1=new Chart($("#c1"),{type:"bar",data:{labels:[],datasets:[{data:[],borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{ticks:{callback(v){const s=this.getLabelForValue(v);return s.length>16?s.slice(0,15)+"…":s}}}}}});
  ch2=new Chart($("#c2"),{type:"doughnut",data:{labels:[],datasets:[{data:[],borderColor:"#0f172a"}]},options:{maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"right"}}}});
  ch3=new Chart($("#c3"),{type:"doughnut",data:{labels:["Voltooid","In uitvoering","Niet gestart"],datasets:[{data:[0,0,0],backgroundColor:["#22c55e","#3b82f6","#64748b"],borderColor:"#0f172a"}]},options:{maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"right"},tooltip:{callbacks:{label(ctx){const t=ctx.dataset.data.reduce((a,b)=>a+b,0)||1;return ctx.label+": "+ctx.raw+" ("+Math.round(100*ctx.raw/t)+"%)"}}}}}});
 }
 ch1.data.labels=BK;ch1.data.datasets[0].data=bc;ch1.data.datasets[0].backgroundColor=BK.map((_,i)=>PAL[i%PAL.length]);ch1.update();
 ch2.data.labels=wl;ch2.data.datasets[0].data=wl.map(k=>wc[k]);ch2.data.datasets[0].backgroundColor=wl.map((_,i)=>PAL[i%PAL.length]);ch2.update();
 ch3.data.datasets[0].data=[done,prog,todo];ch3.update();
}
addEventListener("resize",()=>T.length&&render());
load(sample(),"Voorbeeldgegevens");
</script></body></html>
